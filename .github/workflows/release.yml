name: Release Zipsa

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      # Avoid concurrent creation of the same draft release.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Validate version and configure optional app signing
        run: node scripts/prepare-release.mjs
        env:
          ZIPSA_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          ZIPSA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ZIPSA_APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          ZIPSA_APPLE_ID: ${{ secrets.APPLE_ID }}
          ZIPSA_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          ZIPSA_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "집사 · Zipsa ${{ github.ref_name }}"
          releaseBody: "집사 설치 파일입니다. macOS는 DMG, Windows는 설치 EXE를 내려받아 주세요."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          generateReleaseNotes: true
          args: --target ${{ matrix.target }} --bundles ${{ runner.os == 'Windows' && 'nsis' || 'app,dmg' }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after all platforms succeed
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) throw new Error('빌드된 릴리스를 찾을 수 없습니다.');
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id, per_page: 100 });
            const required = [
              ['Apple Silicon Mac', /_aarch64\.dmg$/i],
              ['Intel Mac', /_x64\.dmg$/i],
              ['Windows x64', /_x64-setup\.exe$/i],
            ];
            for (const [platform, pattern] of required) {
              if (!assets.some(asset => pattern.test(asset.name) && asset.state === 'uploaded' && asset.size > 0)) {
                throw new Error(`설치 파일이 완성되지 않았습니다: ${platform}`);
              }
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false, make_latest: 'true' });
